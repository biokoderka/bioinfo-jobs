<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — BioInfoJobs</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0010; --bg2:#0f0018; --bg3:#150020;
  --border:#2a1040; --border2:#3d1860;
  --magenta:#ff2d9b; --violet:#b44fff; --violet-dim:#7a30b8;
  --pink-soft:#ff85c8; --green:#06d6a0; --red:#e63946;
  --text:#f0e8ff; --text-dim:#9b80c0; --text-mute:#5a3878;
  --glow-m:rgba(255,45,155,0.18); --glow-v:rgba(180,79,255,0.15);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background-image:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(180,79,255,0.10) 0%,transparent 70%);}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:36px;
  width:100%;max-width:360px;text-align:center;}
.login-icon{font-size:36px;margin-bottom:16px;}
.login-title{font-size:20px;font-weight:800;margin-bottom:6px;}
.login-title span{background:linear-gradient(90deg,var(--magenta),var(--violet));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.login-sub{font-size:12px;color:var(--text-mute);margin-bottom:24px;font-family:'DM Mono',monospace;}
.login-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);
  padding:11px 14px;border-radius:8px;font-size:14px;width:100%;margin-bottom:12px;
  text-align:center;letter-spacing:2px;}
.login-input:focus{outline:none;border-color:var(--violet);box-shadow:0 0 10px var(--glow-v);}
.login-btn{background:linear-gradient(135deg,var(--magenta),var(--violet));color:#fff;
  border:none;border-radius:8px;padding:11px;width:100%;font-size:14px;font-weight:700;
  cursor:pointer;transition:all 0.18s;box-shadow:0 0 16px var(--glow-m);}
.login-btn:hover{box-shadow:0 0 28px var(--glow-m);}
.login-error{color:#ff6b7a;font-size:12px;margin-top:8px;font-family:'DM Mono',monospace;display:none;}

/* ADMIN APP */
#admin-app{display:none;}

/* HEADER */
#header{background:rgba(10,0,16,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
  padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:100;}
.admin-logo{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;}
.admin-badge{background:linear-gradient(135deg,var(--magenta),var(--violet));color:#fff;
  font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;letter-spacing:1px;}
.header-actions{display:flex;gap:8px;align-items:center;}
.btn{cursor:pointer;border:none;border-radius:7px;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;font-weight:600;padding:7px 13px;transition:all 0.15s;}
.btn:hover{transform:translateY(-1px);}
.btn-ghost{background:transparent;color:var(--text-mute);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border2);color:var(--text-dim);}
.btn-approve{background:rgba(6,214,160,0.15);color:var(--green);border:1px solid rgba(6,214,160,0.3);}
.btn-approve:hover{background:rgba(6,214,160,0.25);box-shadow:0 0 12px rgba(6,214,160,0.2);}
.btn-reject{background:rgba(230,57,70,0.12);color:var(--red);border:1px solid rgba(230,57,70,0.25);}
.btn-reject:hover{background:rgba(230,57,70,0.22);}
.btn-refresh{background:var(--bg3);color:var(--violet);border:1px solid var(--violet-dim);}
.btn-refresh:hover{box-shadow:0 0 10px var(--glow-v);}
.btn:disabled{opacity:0.35;cursor:not-allowed;transform:none;}

/* LAYOUT */
#main{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 57px);overflow:hidden;}
#left{border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;}

/* TABS */
.tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.tab{flex:1;background:transparent;border:none;color:var(--text-mute);padding:10px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;
  border-bottom:2px solid transparent;transition:all 0.15s;}
.tab.active{color:var(--magenta);border-bottom-color:var(--magenta);}

/* STATS BAR */
#stats-bar{padding:12px 14px;display:flex;gap:12px;border-bottom:1px solid var(--border);flex-shrink:0;}
.stat{text-align:center;flex:1;}
.stat-num{font-size:18px;font-weight:800;font-family:'DM Mono',monospace;}
.stat-label{font-size:9px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px;}

/* SUBMISSION LIST */
.sub-card{padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:all 0.15s;}
.sub-card:hover{background:var(--bg2);}
.sub-card.active{background:var(--bg3);border-left:3px solid var(--magenta);}
.sub-card.approved{border-left:3px solid var(--green);}
.sub-card.rejected{opacity:0.45;}
.sub-title{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
.sub-company{font-size:11px;color:var(--text-dim);}
.sub-meta{font-size:10px;color:var(--text-mute);margin-top:4px;font-family:'DM Mono',monospace;
  display:flex;justify-content:space-between;align-items:center;}
.status-pill{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;}
.pill-pending{background:rgba(255,213,102,0.15);color:#ffd166;}
.pill-approved{background:rgba(6,214,160,0.15);color:var(--green);}
.pill-rejected{background:rgba(230,57,70,0.12);color:var(--red);}

/* DETAIL PANEL */
#right{overflow-y:auto;padding:28px;}
#empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;color:var(--text-mute);text-align:center;}
#empty-detail .icon{font-size:40px;margin-bottom:12px;}
#detail-view{display:none;}
.detail-title{font-size:20px;font-weight:800;margin-bottom:6px;line-height:1.3;}
.detail-meta{font-size:13px;color:var(--text-dim);margin-bottom:4px;}
.detail-source{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-mute);margin-bottom:16px;}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
.detail-actions .btn{font-size:13px;padding:9px 18px;}

.info-box{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px;}
.info-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-mute);letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:10px;}
.info-text{font-size:13px;color:var(--text-dim);line-height:1.8;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.info-item{display:flex;flex-direction:column;gap:3px;}
.info-item-label{font-size:10px;color:var(--text-mute);font-family:'DM Mono',monospace;}
.info-item-value{font-size:13px;color:var(--text);}
.geo-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.link-btn{color:var(--magenta);text-decoration:none;font-size:13px;font-weight:600;
  padding:6px 12px;border:1px solid rgba(255,45,155,0.3);border-radius:8px;
  background:rgba(255,45,155,0.07);display:inline-block;transition:all 0.15s;}
.link-btn:hover{background:rgba(255,45,155,0.15);}

.toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border2);
  border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;z-index:999;
  animation:slideIn 0.25s ease;box-shadow:0 8px 32px rgba(0,0,0,0.4);}
.toast.success{border-color:rgba(6,214,160,0.4);color:var(--green);}
.toast.error{border-color:rgba(230,57,70,0.4);color:var(--red);}
@keyframes slideIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

#status-bar-msg{background:rgba(180,79,255,0.08);padding:6px 20px;font-size:11px;
  font-family:'DM Mono',monospace;color:var(--violet);border-bottom:1px solid var(--border);display:none;}

.empty-list{padding:32px 20px;text-align:center;color:var(--text-mute);font-size:12px;}

@media(max-width:700px){
  #main{grid-template-columns:1fr;height:auto;}
  #left{height:40vh;}
  #right{min-height:60vh;}
}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title"><span>BioInfoJobs</span> Admin</div>
    <div class="login-sub">biokoderka · restricted access</div>
    <input class="login-input" type="password" id="pw-input" placeholder="••••••••" autocomplete="current-password">
    <button class="login-btn" id="pw-btn">Enter</button>
    <div class="login-error" id="pw-error">Incorrect password</div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app">
  <div id="header">
    <div class="admin-logo">
      🧬 BioInfoJobs <span class="admin-badge">ADMIN</span>
    </div>
    <div class="header-actions">
      <span id="admin-time" style="font-size:10px;color:var(--text-mute);font-family:'DM Mono',monospace"></span>
      <button class="btn btn-refresh" id="btn-load">⟳ Reload issues</button>
      <a class="btn btn-ghost" href="index.html" target="_blank">↗ View site</a>
      <button class="btn btn-ghost" id="btn-logout">Logout</button>
    </div>
  </div>

  <div id="status-bar-msg"></div>

  <div id="main">
    <!-- LEFT: submission list -->
    <div id="left">
      <div class="tab-bar">
        <button class="tab active" data-tab="pending">⏳ Pending</button>
        <button class="tab" data-tab="approved">✅ Approved</button>
        <button class="tab" data-tab="rejected">❌ Rejected</button>
        <button class="tab" data-tab="all">All</button>
      </div>

      <div id="stats-bar">
        <div class="stat"><div class="stat-num" id="stat-pending" style="color:#ffd166">—</div><div class="stat-label">Pending</div></div>
        <div class="stat"><div class="stat-num" id="stat-approved" style="color:var(--green)">—</div><div class="stat-label">Approved</div></div>
        <div class="stat"><div class="stat-num" id="stat-rejected" style="color:var(--red)">—</div><div class="stat-label">Rejected</div></div>
      </div>

      <div id="sub-list"></div>
    </div>

    <!-- RIGHT: detail -->
    <div id="right">
      <div id="empty-detail">
        <div class="icon">📋</div>
        <p>Select a submission to review</p>
      </div>
      <div id="detail-view">
        <div class="detail-title" id="d-title"></div>
        <div class="detail-meta" id="d-meta"></div>
        <div class="detail-source" id="d-source"></div>

        <div class="detail-actions" id="d-actions"></div>

        <div class="info-box">
          <div class="info-label">◆ Details</div>
          <div class="info-grid">
            <div class="info-item"><div class="info-item-label">Region</div><div class="info-item-value" id="d-geo"></div></div>
            <div class="info-item"><div class="info-item-label">Sector</div><div class="info-item-value" id="d-cat"></div></div>
            <div class="info-item"><div class="info-item-label">Deadline</div><div class="info-item-value" id="d-deadline"></div></div>
            <div class="info-item"><div class="info-item-label">Submitted by</div><div class="info-item-value" id="d-submitter"></div></div>
            <div class="info-item" style="grid-column:1/-1"><div class="info-item-label">Contact e-mail</div><div class="info-item-value" id="d-email"></div></div>
          </div>
        </div>

        <div class="info-box">
          <div class="info-label">◆ Description</div>
          <div class="info-text" id="d-desc"></div>
        </div>

        <div class="info-box">
          <div class="info-label">◆ Original listing</div>
          <a id="d-url" href="#" target="_blank" rel="noopener" class="link-btn">🔗 Open original listing ↗</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ── CONFIG — set these before deploying ──────────────────────────────────────
const GITHUB_OWNER = "YOUR_USERNAME";
const GITHUB_REPO  = "bioinfo-jobs";
// Fine-grained token with issues:write on this repo
// Create at: github.com/settings/tokens/new?type=beta
const GITHUB_TOKEN = "YOUR_GITHUB_FINE_GRAINED_TOKEN";

// Admin password — change this! Stored only in this file (client-side).
// For extra security, host admin.html separately or use GitHub Pages access control.
const ADMIN_PASSWORD_HASH = "REPLACE_WITH_SHA256_OF_YOUR_PASSWORD";
// Generate hash: https://emn178.github.io/online-tools/sha256.html
// Or run in browser console: crypto.subtle.digest('SHA-256', new TextEncoder().encode('yourpassword'))
//   .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))

// ── PASSWORD ──────────────────────────────────────────────────────────────────
async function hashPassword(pw) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(pw));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2,"0")).join("");
}

async function tryLogin() {
  const pw = document.getElementById("pw-input").value;
  const hash = await hashPassword(pw);
  if (hash === ADMIN_PASSWORD_HASH) {
    sessionStorage.setItem("admin_auth", hash);
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("admin-app").style.display = "block";
    loadIssues();
  } else {
    document.getElementById("pw-error").style.display = "block";
    document.getElementById("pw-input").value = "";
    document.getElementById("pw-input").focus();
  }
}

document.getElementById("pw-btn").addEventListener("click", tryLogin);
document.getElementById("pw-input").addEventListener("keydown", e => { if (e.key==="Enter") tryLogin(); });
document.getElementById("btn-logout").addEventListener("click", () => {
  sessionStorage.removeItem("admin_auth"); location.reload();
});

// Auto-login if session active
window.addEventListener("load", () => {
  const saved = sessionStorage.getItem("admin_auth");
  if (saved && saved === ADMIN_PASSWORD_HASH) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("admin-app").style.display = "block";
    loadIssues();
  }
  setInterval(() => {
    document.getElementById("admin-time").textContent = new Date().toLocaleTimeString();
  }, 1000);
});

// ── STATE ─────────────────────────────────────────────────────────────────────
let issues = [];
let selected = null;
let activeTab = "pending";

const GEO_COLORS = { "Poland":"#e63946","Europe":"#b44fff","USA":"#ff2d9b","Remote":"#ff85c8","Other":"#5a3878" };
const GEO_FLAGS  = { "Poland":"🇵🇱","Europe":"🇪🇺","USA":"🇺🇸","Remote":"🌐","Other":"🌍" };

// ── GITHUB API ────────────────────────────────────────────────────────────────
const ghHeaders = () => ({
  "Authorization": `Bearer ${GITHUB_TOKEN}`,
  "Accept": "application/vnd.github+json",
  "X-GitHub-Api-Version": "2022-11-28"
});

function setStatus(msg) {
  const el = document.getElementById("status-bar-msg");
  el.textContent = msg; el.style.display = msg ? "block" : "none";
}

async function loadIssues() {
  setStatus("Loading submissions from GitHub Issues...");
  document.getElementById("btn-load").disabled = true;
  try {
    // Fetch all issues with job-submission label (open + closed)
    const [openRes, closedRes] = await Promise.all([
      fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?labels=job-submission&state=open&per_page=100`, { headers: ghHeaders() }),
      fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?labels=job-submission&state=closed&per_page=100`, { headers: ghHeaders() })
    ]);
    const open   = await openRes.json();
    const closed = await closedRes.json();

    issues = [...(Array.isArray(open)?open:[]), ...(Array.isArray(closed)?closed:[])].map(issue => {
      const data = parseSubmissionData(issue.body);
      const labelNames = (issue.labels||[]).map(l=>l.name);
      const status = labelNames.includes("approved") ? "approved"
                   : issue.state === "closed" ? "rejected"
                   : "pending";
      return { ...data, issueNumber: issue.number, issueUrl: issue.html_url, status,
               createdAt: issue.created_at?.slice(0,10) || "—" };
    });

    updateStats();
    renderList();
    setStatus(`✓ Loaded ${issues.length} submissions`);
    setTimeout(() => setStatus(""), 3000);
  } catch(e) {
    setStatus(`⚠ Error loading issues: ${e.message}`);
  }
  document.getElementById("btn-load").disabled = false;
}

function parseSubmissionData(body) {
  try {
    const match = body.match(/<!-- SUBMISSION_DATA\n([\s\S]+?)\n-->/);
    if (match) return JSON.parse(match[1]);
  } catch(e) {}
  // Fallback: parse markdown table
  const get = (field) => {
    const m = body.match(new RegExp(`\\| \\*\\*${field}\\*\\* \\| (.+?) \\|`));
    return m ? m[1].trim() : "—";
  };
  return { title: get("Title"), company: get("Company"), location: get("Location"),
           geo: get("Region"), category: get("Sector"), url: "#", desc: "—", submitter: "—" };
}

// ── STATS ─────────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById("stat-pending").textContent  = issues.filter(i=>i.status==="pending").length;
  document.getElementById("stat-approved").textContent = issues.filter(i=>i.status==="approved").length;
  document.getElementById("stat-rejected").textContent = issues.filter(i=>i.status==="rejected").length;
}

// ── RENDER LIST ───────────────────────────────────────────────────────────────
function renderList() {
  const filtered = issues.filter(i => activeTab==="all" || i.status===activeTab);
  const list = document.getElementById("sub-list");

  if (!filtered.length) {
    list.innerHTML = `<div class="empty-list">No ${activeTab} submissions</div>`;
    return;
  }

  list.innerHTML = filtered.map(i => {
    const pill = i.status==="pending"  ? `<span class="status-pill pill-pending">pending</span>`
               : i.status==="approved" ? `<span class="status-pill pill-approved">approved</span>`
               :                         `<span class="status-pill pill-rejected">rejected</span>`;
    return `<div class="sub-card ${i.status} ${selected?.issueNumber===i.issueNumber?'active':''}"
              data-num="${i.issueNumber}">
      <div class="sub-title">${i.title||"Untitled"}</div>
      <div class="sub-company">${i.company||"—"} · ${i.location||"—"}</div>
      <div class="sub-meta"><span>${i.createdAt}</span>${pill}</div>
    </div>`;
  }).join("");

  list.querySelectorAll(".sub-card").forEach(el => {
    el.addEventListener("click", () => selectIssue(parseInt(el.dataset.num)));
  });
}

// ── DETAIL ────────────────────────────────────────────────────────────────────
function selectIssue(num) {
  selected = issues.find(i => i.issueNumber === num);
  if (!selected) return;
  renderList(); // re-render to update active state

  document.getElementById("empty-detail").style.display = "none";
  const dv = document.getElementById("detail-view");
  dv.style.display = "block";

  document.getElementById("d-title").textContent  = selected.title || "Untitled";
  document.getElementById("d-meta").textContent   = (selected.company||"—") + " · " + (selected.location||"—");
  document.getElementById("d-source").textContent = `Submitted: ${selected.createdAt} · Issue #${selected.issueNumber}`;
  document.getElementById("d-desc").textContent   = selected.desc || selected.description || "No description provided.";

  const gc = GEO_COLORS[selected.geo]||"#5a3878";
  const gf = GEO_FLAGS[selected.geo]||"🌍";
  document.getElementById("d-geo").innerHTML = `<span class="geo-pill" style="background:${gc}20;color:${gc};border:1px solid ${gc}40">${gf} ${selected.geo||"—"}</span>`;
  document.getElementById("d-cat").textContent      = selected.category || "—";
  document.getElementById("d-deadline").textContent  = selected.deadline || "—";
  document.getElementById("d-submitter").textContent = selected.submitter || "anonymous";
  document.getElementById("d-email").innerHTML = selected.email
    ? `<a href="mailto:${selected.email}" style="color:var(--magenta)">${selected.email}</a>`
    : "—";

  const urlEl = document.getElementById("d-url");
  urlEl.href = selected.url || "#";
  urlEl.style.opacity = selected.url && selected.url !== "#" ? "1" : "0.4";

  // Actions
  const actions = document.getElementById("d-actions");
  if (selected.status === "pending") {
    actions.innerHTML = `
      <button class="btn btn-approve" id="btn-approve-now">✅ Approve & add to board</button>
      <button class="btn btn-reject"  id="btn-reject-now">❌ Reject</button>
      <a href="${selected.issueUrl}" target="_blank" class="btn btn-ghost">↗ View GitHub Issue</a>`;
    document.getElementById("btn-approve-now").addEventListener("click", () => approveIssue(selected));
    document.getElementById("btn-reject-now").addEventListener("click",  () => rejectIssue(selected));
  } else {
    const statusLabel = selected.status === "approved" ? "✅ Approved" : "❌ Rejected";
    actions.innerHTML = `
      <span class="btn btn-ghost" style="cursor:default">${statusLabel}</span>
      <a href="${selected.issueUrl}" target="_blank" class="btn btn-ghost">↗ View GitHub Issue</a>`;
  }
}

// ── APPROVE ───────────────────────────────────────────────────────────────────
async function approveIssue(issue) {
  const btn = document.getElementById("btn-approve-now");
  btn.disabled = true; btn.textContent = "Approving...";

  try {
    // 1. Add "approved" label to issue
    await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${issue.issueNumber}/labels`, {
      method: "POST", headers: ghHeaders(),
      body: JSON.stringify({ labels: ["approved"] })
    });

    // 2. Remove "pending-review" label
    await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${issue.issueNumber}/labels/pending-review`, {
      method: "DELETE", headers: ghHeaders()
    });

    // 3. Add approval comment with /approve command (triggers GitHub Action)
    await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${issue.issueNumber}/comments`, {
      method: "POST", headers: ghHeaders(),
      body: JSON.stringify({ body: "/approve" })
    });

    showToast("✅ Approved! Job will appear after next refresh.", "success");
    issue.status = "approved";
    updateStats();
    renderList();
    selectIssue(issue.issueNumber);
  } catch(e) {
    showToast(`⚠ Error: ${e.message}`, "error");
    btn.disabled = false; btn.textContent = "✅ Approve & add to board";
  }
}

// ── REJECT ────────────────────────────────────────────────────────────────────
async function rejectIssue(issue) {
  if (!confirm(`Reject "${issue.title}"?\nThe GitHub Issue will be closed.`)) return;
  const btn = document.getElementById("btn-reject-now");
  btn.disabled = true; btn.textContent = "Rejecting...";

  try {
    await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${issue.issueNumber}`, {
      method: "PATCH", headers: ghHeaders(),
      body: JSON.stringify({ state: "closed" })
    });
    showToast("❌ Rejected & issue closed.", "error");
    issue.status = "rejected";
    updateStats();
    renderList();
    selectIssue(issue.issueNumber);
  } catch(e) {
    showToast(`⚠ Error: ${e.message}`, "error");
    btn.disabled = false; btn.textContent = "❌ Reject";
  }
}

// ── TABS ──────────────────────────────────────────────────────────────────────
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    activeTab = tab.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    selected = null;
    document.getElementById("empty-detail").style.display = "flex";
    document.getElementById("detail-view").style.display = "none";
    renderList();
  });
});

document.getElementById("btn-load").addEventListener("click", loadIssues);

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg, type="success") {
  const t = document.createElement("div");
  t.className = `toast ${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}
</script>
</body>
</html>
